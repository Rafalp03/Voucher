# Publikacja frontendu (katalog frontend/) na GitHub Pages.
# Na *.github.io frontend sam przełącza się w tryb mock, bo nie ma tam backendu.
# Wymaga jednorazowego ustawienia: Settings -> Pages -> Source: "GitHub Actions".
name: GitHub Pages (frontend)

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publikacja frontendu
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
