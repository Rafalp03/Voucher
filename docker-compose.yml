services:
  api:
    build: .
    container_name: voucher-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: voucher-db
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Port wystawiony tylko lokalnie, do podglądu bazy np. w DBeaverze
    ports:
      # Port na hoście ustawiany w .env (POSTGRES_PORT), domyślnie 5433,
      # żeby nie kolidować z lokalnym PostgreSQL ani zarezerwowanymi portami Windows
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
